services:
  - type: web
    name: deped-leyte-drrm-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: deped-leyte-drrm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: WEB_ORIGIN
        value: https://REPLACE-WITH-YOUR-NETLIFY-SITE.netlify.app
      - key: FIRMS_MAP_KEY
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "10"

databases:
  - name: deped-leyte-drrm-db
    plan: starter
    postgresMajorVersion: "16"
